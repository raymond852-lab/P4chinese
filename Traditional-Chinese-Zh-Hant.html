  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --paper:#ffffff;
  --ink:#111111;
  --muted:#444444;
  --line:#111111;
  --cream:#ececec;
  --red:#c81e1e;
  --blue:#1d4ed8;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#ffffff;
    --ink:#111111;
    --muted:#444444;
    --line:#111111;
    --cream:#ececec;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
}

.font-sans-tc{
  font-family:"Noto Sans TC",sans-serif;
}

.a4-page{
  width:210mm;
  max-width:100%;
  min-height:297mm;
  background:#fff;
  color:#000;
  margin:0 auto;
  padding:15mm 16mm 13mm;
  position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.16);
}

.a4-page + .a4-page{
  margin-top:18px;
}

.passage-text{
  font-size:13.5pt;
  line-height:1.8;
  text-align:justify;
}

.question-text{
  font-size:12pt;
  line-height:1.8;
}

.red-mark{
  display:inline;
  border:1.6px solid var(--red);
  border-radius:46% 54% 52% 48% / 58% 48% 52% 42%;
  padding:0 3px;
  margin:0 1px;
  color:inherit;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}

.blue-mark{
  -webkit-text-decoration: underline wavy var(--blue) 1.8px;
          text-decoration: underline wavy var(--blue) 1.8px;
  text-underline-offset:4px;
  -webkit-text-decoration-skip-ink:none;
          text-decoration-skip-ink:none;
  padding-bottom:2px;
}

.note-box{
  border:1px solid #111;
  padding:6px 8px;
  font-size:10.5pt;
  line-height:1.55;
  background:#fff;
}

.opt-correct{
  border-color:#111 !important;
}

@page{
  size:A4;

  margin:12mm;
}

@media print{
  html,body{
    background:#fff !important;
  }

  body{
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .no-print{
    display:none !important;
  }

  .a4-page{
    width:auto;
    min-height:0;
    height:273mm;
    margin:0;
    padding:0;
    box-shadow:none;
    overflow:hidden;
    -moz-column-break-after:page;
         break-after:page;
    page-break-after:always;
  }

  .a4-page:last-child{
    -moz-column-break-after:auto;
         break-after:auto;
    page-break-after:auto;
  }

  .a4-page + .a4-page{
    margin-top:0;
  }
}

.hover\:bg-zinc-100:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(244 244 245 / var(--tw-bg-opacity, 1));
}

@media (min-width: 640px){
  .sm\:ml-\[42px\]{
    margin-left: 42px;
  }

  .sm\:block{
    display: block;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:justify-between{
    justify-content: space-between;
  }

  .sm\:gap-0{
    gap: 0px;
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[20px\]{
    font-size: 20px;
  }

  .sm\:text-\[34px\]{
    font-size: 34px;
  }
}

@media (min-width: 1024px){
  .lg\:w-\[190px\]{
    width: 190px;
  }

  .lg\:shrink-0{
    flex-shrink: 0;
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-center{

  }

  .lg\:justify-between{

  }
}
