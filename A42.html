:root {
  --paper: #ffffff;
  --ink: #111111;
  --muted: #555555;
  --line: #111111;
  --surface: #e9e7e2;
  --red: #c1272d;
  --blue: #1d4ed8;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #ffffff;
    --ink: #111111;
    --muted: #555555;
    --line: #111111;
    --surface: #1a1a1a;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--surface);
  color: var(--ink);
  font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}

@page {
  size: A4;

  margin: 12mm;
}

.a4-page {
  width: 210mm;
  max-width: 100%;
  min-height: 297mm;
  background: var(--paper);
  color: var(--ink);
  padding: 13mm 14mm 12mm;
  margin: 0 auto 14mm;
  box-shadow: 0 10px 30px rgba(0,0,0,.16);
  position: relative;
  overflow-x: clip;
}

.page-foot {
  position: absolute;
  left: 14mm;
  right: 14mm;
  bottom: 7mm;
  display: flex;
  justify-content: space-between;
  font-family: "Noto Sans TC", sans-serif;
  font-size: 9pt;
  color: var(--muted);
}

.mark-circle {
  border: 1.6px solid var(--red);
  border-radius: 999px;
  padding: 0 5px;
  margin: 0 1px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  line-height: 1.8;
}

.mark-blue {
  text-decoration: underline;
  text-decoration-color: var(--blue);
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
  -webkit-text-decoration-color: var(--blue);
}

.mark-bold {
  font-weight: 700;
}

.side-note {
  border: 1px solid var(--ink);
  padding: 6px 8px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: 10pt;
  line-height: 1.5;
}

.think-box {
  border: 1px solid var(--ink);
  padding: 8px 10px;
}

.answer-box {
  border: 1px solid var(--ink);
  padding: 8px 10px;
}

.write-line {
  border-bottom: 1px dotted #888;
  height: 28px;
}

.option-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

@media (max-width: 760px) {
  .a4-page {
    padding: 16px 14px 28px;
    min-height: auto;
    margin-bottom: 12px;
  }

  .page-foot {
    left: 14px;
    right: 14px;
    bottom: 8px;
  }
}

@media print {
  body {
    background: #fff;
  }

  .no-print {
    display: none !important;
  }

  .a4-page {
    width: auto;
    max-width: none;
    min-height: 0;
    margin: 0;
    padding: 0;
    box-shadow: none;
    -moz-column-break-after: page;
         break-after: page;
    overflow: visible;
  }

  .a4-page:last-child {
    -moz-column-break-after: auto;
         break-after: auto;
  }

  .page-foot {
    position: static;
    margin-top: 8mm;
    left: auto;
    right: auto;
    bottom: auto;
  }
}
