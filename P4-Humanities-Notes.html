:root{
  --bg: #FFF9F0;
  --ink: #2D2A26;
  --paper: #FFFFFF;
  --blue: #E6F0FF;
  --yellow: #FFF7CC;
  --green: #E8F8E8;
  --pink: #FFE8F0;
  --orange: #FFF0E0;
  --purple: #F0E8FF;
  --line: #F0E6D8;
  --safe-area-inset-top: env(safe-area-inset-top);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #1A1A1A;
    --ink: #2D2A26;
    --paper: #FFFFFF;
    --line: #E8DDD0;
  }
}

* {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body{
  margin:0;
  font-family: "Noto Sans TC", "Baloo 2", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 16px;
  line-height: 1.4;
}

/* Enlarged typography requirements */

h1{
  font-size: 28pt;
  line-height: 1.1;
}

h2{
  font-size: 18pt;
  line-height: 1.2;
  font-weight: 800;
}

h3{
  font-size: 14pt;
  font-weight: 700;
  line-height: 1.25;
}

@media screen{
  h1{
    font-size: 32px;
  }

  h2{
    font-size: 18px;
  }

  h3{
    font-size: 16px;
  }

  .page{
    font-size: 16px;
    line-height: 1.4;
  }
}

.page{
  background: var(--paper);
  width: 210mm;
  max-width: 100%;
  min-height: 297mm;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}

@media screen{
  .page{
    border: 1.5px dashed #E8DCCA;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08), 0 0 0 12px #FFFDF8;
    border-radius: 18px;
    margin: 20px auto;
  }
}

@media print{
  @page{
    size: A4;

    margin: 0;
  }

  html, body{
    background: white !important;
    margin:0 !important;
    padding:0 !important;
    font-size: 14pt !important;
    line-height: 1.4 !important;
  }

  .no-print{
    display:none !important;
  }

  .page{
    border: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    margin:0 !important;
    width: 210mm !important;
    height: 297mm !important;
    min-height: 297mm !important;
    max-height: 297mm !important;
    page-break-after: always;
    overflow: hidden;
    padding: 8mm !important;
    font-size: 12.5pt !important;
    line-height: 1.35 !important;
  }

  .page:last-child{
    page-break-after: auto;
  }
}

@media (min-width: 768px){
  .md\:px-4{
