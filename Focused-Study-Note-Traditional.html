["靜兒一站定，我們就熱烈地拍掌。","老師一說完指示，同學們就開始認真地做起練習來。"],extendedExamples:["我一打開書包，就發現忘記帶水壺了。","鈴聲一響，同學們就安靜地回到座位上。"],logicCheck:["問時間：是否「剛完成A，立刻就做B」？有無「一…就」的緊接感？","查主語：前後主語是誰？是否一致或清楚交代？「我一到學校，媽媽就上課」即主語混亂。","順序測試：對調前後動作，時間上是否不合理？若不合理，代表原句順序正確。"]},{key:"條件",label:"條件複句",concept:"表示在任何條件下，結果都不會改變",features:["表示在任何條件下，結果都不會改變","語氣堅決，帶有「無論如何」的意思","後句常用「也」強調不變"],synonyms:["任憑……，也……"],warning:"任憑句型必須配「也」，不可配「就」。而且後句結果必須是「不變」的堅定結果，若寫成會改變的結果，即邏輯錯。",standardExamples:["任憑誰怎樣呼喚，牠也不肯回來。"],extendedExamples:["任憑風雨多大，升旗隊也堅持完成訓練。","任憑同學們怎樣勸他，他也不肯承認錯誤。"],logicCheck:["加「任何」測試：在「任憑」後加上「任何」是否通順？通順則是條件句。","結果不變測試：問——無論前面條件怎樣變，後面結果是否都不變？是則正確。","關聯詞測試：必須是「任憑…也…」，若出現「就」即錯。"]}],xm=[{type:"遞進",conj:"不單...還... / 不但...而且... / 不僅...還...",logic:"重點在後，後比前深",keyword:"更深、進一步",color:G.遞進},{type:"假設",conj:"即使...也... / 就算...也... / 儘管...也...",logic:"重點在結果，假設不一定真",keyword:"假設、相反結果",color:G.假設},{type:"轉折",conj:"不是...而是... / 不...而... / 不像...而像...",logic:"重點在後，否定前面",keyword:"相反、對比",color:G.轉折},{type:"承接",conj:"一...就...",logic:"重點在快，緊接發生",keyword:"連續、迅速",color:G.承接},{type:"條件",conj:"任憑...也...",logic:"重點在不變，任何條件下",keyword:"無論如何",color:G.條件}],Sm=[{type:"遞進",color:G.遞進,wrong:"我們不單要跑步，還要行路。",why:"錯，因為「行路」比「跑步」淺，遞進深淺倒轉。應改為：不單要行路，還要跑步。"},{type:"假設",color:G.假設,wrong:"即使落大雨，他就留在家中。",why:"錯，關聯詞配搭錯。即使...就... 是錯誤配對，應該是 即使...也..."},{type:"轉折",color:G.轉折,wrong:"這個不是我的書包，而我的文具盒。",why:"錯，漏字。正確必須是「不是...而是...」或「不...而...」，此句少了「是」。"},{type:"承接",color:G.承接,wrong:"我一到學校，媽媽就開始上課。",why:"錯，主語混亂。前句主語是「我」，後句主語突然變「媽媽」，動作邏輯不連貫。"},{type:"條件",color:G.條件,wrong:"任憑老師怎樣解釋，他就聽不明白。",why:"錯，語氣不足。任憑句必須配「也」，不能配「就」，否則失去「無論如何都不變」的堅決語氣。"}],Tl=[{id:1,type:"續寫",q:"請用「不單……還……」完成句子：小美不單喜歡畫畫，________。",a:"小美不單喜歡畫畫，還喜歡彈鋼琴，而且兩樣都做得很好。（後句必須比前句更深或更廣）"},{id:2,type:"續寫",q:"請用「一……就……」完成句子：老師一說「開始」，________。",a:"老師一說「開始」，同學們就立刻拿起筆，認真寫作。（強調緊接發生）"},{id:3,type:"續寫",q:"請用「即使……也……」完成句子：即使今天很疲倦，________。",a:"即使今天很疲倦，我也要完成中文家課才睡覺。（結果不因假設改變）"},{id:4,type:"續寫",q:"請用「不是……而是……」完成句子：這次遲到不是因為貪睡，________。",a:"這次遲到不是因為貪睡，而是因為巴士在路上壞了。"},{id:5,type:"續寫",q:"請用「任憑……也……」完成句子：任憑外面多麼嘈吵，________
